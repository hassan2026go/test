<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة العشيرة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#2b2418;--mut:#7a6f5d;--ac:#2f6b4f;--acx:#fff;--bd:#e4dccb;--warn:#b5651d;--hl:#e8f2ec}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a16;--card:#262520;--tx:#efe9dc;--mut:#a39a86;--ac:#5fb58b;--acx:#10231a;--bd:#3a3830;--warn:#e0a060;--hl:#25352d}}
:root[data-theme="dark"]{--bg:#1b1a16;--card:#262520;--tx:#efe9dc;--mut:#a39a86;--ac:#5fb58b;--acx:#10231a;--bd:#3a3830;--warn:#e0a060;--hl:#25352d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.w{max-width:1000px;margin:0 auto;padding:14px}
h1{margin:0;font-size:1.4rem}.sub{color:var(--mut);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.d{color:#c0392b}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--ac);color:var(--acx)}
.bd{background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}
.tree{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px}.row.sel{background:var(--hl)}
.tg{border:0;background:none;padding:0 4px;width:24px;color:var(--ac)}
.nm{cursor:pointer}.ct{font-size:.72rem;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 10px;cursor:pointer;background:var(--hl)}
.res{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer}.res:hover{background:var(--hl)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.md label{display:block;margin-top:8px;font-size:.85rem;color:var(--mut)}
.mut{color:var(--mut)}.pend{border:1px dashed var(--warn)}
.banner{background:var(--hl);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;margin:10px 0;white-space:pre-wrap}
#toast{position:fixed;bottom:20px;inset-inline:0;text-align:center;z-index:10;pointer-events:none}
#toast span{background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px}
</style></head><body><div class="w">
<div style="display:flex;align-items:center;gap:10px"><span id="lg" style="font-size:2rem">🌳</span><div style="flex:1"><h1 id="sn">اسم العشيرة</h1><div class="sub" id="who">جاري التحميل…</div></div><button id="edsite" style="display:none">⚙️ تعديل</button></div><div class="banner" id="bn" style="display:none"></div>
<div class="bar"><input id="q" placeholder="ابحث عن اسم (مثال: محمد بن أحمد)…" style="flex:1;min-width:200px"><button class="p" id="add">+ إضافة اسم</button></div>
<div id="res"></div>
<div class="tabs"><button data-tab="tree" class="on">الشجرة</button><button data-tab="rev" id="revb" style="display:none">المراجعة<span class="bd" id="pc">0</span></button></div>
<div id="app"></div></div><div id="toast"></div>
<script>
let db=null,user=null,isAdmin=false,uid='',people=[],pend=[],byId={},kids={},open=new Set(),sel=null,tab='tree',q='',memo={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const toast=m=>{$('#toast').innerHTML='<span>'+esc(m)+'</span>';setTimeout(()=>$('#toast').innerHTML='',2500)};
function index(){byId={};kids={};memo={};people.forEach(p=>byId[p.id]=p);people.forEach(p=>{const k=p.parentId||'';(kids[k]=kids[k]||[]).push(p)});Object.values(kids).forEach(a=>a.sort((x,y)=>(x.birth||9999)-(y.birth||9999)||x.name.localeCompare(y.name,'ar')))}
function chain(id){const a=[];let c=byId[id],g=0;while(c&&g++<500){a.push(c);c=byId[c.parentId]}return a}
function full(id,n=5){const c=chain(id).slice(0,n);return c.map((p,i)=>i?(c[i-1].gender==='f'?' بنت ':' بن ')+p.name:p.name).join('')}
function cnt(id){if(memo[id]!=null)return memo[id];let n=0;(kids[id]||[]).forEach(c=>n+=1+cnt(c.id));return memo[id]=n}
function pick(id){sel=id;chain(id).slice(1).forEach(p=>open.add(p.id));tab='tree';$('#res').innerHTML='';render()}
function node(p,d){const k=kids[p.id]||[],o=open.has(p.id);
let h=`<div style="margin-inline-start:${d?16:0}px"><div class="row ${sel===p.id?'sel':''}"><button class="tg" data-t="${p.id}">${k.length?(o?'▾':'◂'):'•'}</button><span class="nm" data-s="${p.id}">${esc(p.name)}</span>${k.length?`<span class="ct">${cnt(p.id)}</span>`:''}</div>`;
if(o)h+=k.map(c=>node(c,d+1)).join('');return h+'</div>'}
function detail(){const p=byId[sel];if(!p)return `<div class="card mut">اختر اسماً من الشجرة أو البحث لعرض نسبه وبياناته.</div>`;
const path=chain(sel).reverse(),k=kids[sel]||[];
return `<div class="card"><h3 style="margin:0">${esc(p.name)}</h3><div class="mut">${esc(full(sel,8))}</div>
<b>النسب (من الجذر):</b><div class="chips">${path.map((x,i)=>`<span class="chip" data-s="${x.id}">${esc(x.name)}</span>${i<path.length-1?'←':''}`).join('')}</div>
<div>${p.gender==='f'?'أنثى':'ذكر'}${p.birth?' · مواليد '+esc(p.birth):''} · عدد الأبناء والأحفاد: ${cnt(sel)}</div>
${p.phone?`<div>📞 <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div>`:''}${p.email?`<div>✉️ <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>`:''}${p.notes?`<div class="mut">${esc(p.notes)}</div>`:''}
${k.length?`<b>الأبناء:</b><div class="chips">${k.map(c=>`<span class="chip" data-s="${c.id}">${esc(c.name)}</span>`).join('')}</div>`:''}
<div class="bar"><button class="p" data-add="${p.id}">+ إضافة ابن/ابنة</button>${isAdmin?`<button data-edit="${p.id}">تعديل</button><button class="d" data-del="${p.id}">حذف</button>`:''}</div></div>`}
let site={};
function applySite(){const n=site.name||'اسم العشيرة';$('#sn').textContent=n;document.title=n;$('#lg').innerHTML=site.logo?`<img src="${esc(site.logo)}" alt="" style="height:46px;width:46px;object-fit:cover;border-radius:12px">`:esc(site.emoji||'🌳');const b=$('#bn');b.style.display=site.banner?'':'none';b.textContent=site.banner||'';$('#edsite').style.display=isAdmin?'':'none'}
function siteForm(){const ov=document.createElement('div');ov.className='ov';
ov.innerHTML=`<div class="md"><h3 style="margin:0">إعدادات المنصة</h3><label>اسم العشيرة</label><input id="s_n" value="${esc(site.name)}"><label>الشعار (إيموجي)</label><input id="s_e" value="${esc(site.emoji||'🌳')}"><label>أو صورة شعار (تحل محل الإيموجي)</label><input id="s_f" type="file" accept="image/*">${site.logo?'<label><input type="checkbox" id="s_rm" style="width:auto"> إزالة صورة الشعار</label>':''}<label>نص الشريط العلوي: نبذة أو توجيه (اتركه فارغاً لإخفائه)</label><textarea id="s_b" rows="4">${esc(site.banner)}</textarea><div class="bar"><button class="p" id="s_ok">حفظ</button><button id="s_x">إلغاء</button></div></div>`;
document.body.appendChild(ov);ov.querySelector('#s_x').onclick=()=>ov.remove();
ov.querySelector('#s_ok').onclick=async()=>{try{const d={name:ov.querySelector('#s_n').value.trim(),emoji:ov.querySelector('#s_e').value.trim()||'🌳',banner:ov.querySelector('#s_b').value.trim(),logo:site.logo||''};if(ov.querySelector('#s_rm')?.checked)d.logo='';const f=ov.querySelector('#s_f').files[0];if(f){const as=await claude.use('assets');if(!as)return toast('رفع الصور غير متاح');d.logo=(await as.upload(f)).url}await db.doc('settings/site').set(d);ov.remove()}catch(e){toast('تعذر الحفظ')}}}
function render(){applySite();
$('#who').textContent=`${people.length} اسم · ${isAdmin?'أنت: المدير':'أنت: مشرف (إضافة فقط، بانتظار موافقة المدير)'}`;
$('#revb').style.display=isAdmin?'':'none';$('#pc').textContent=pend.length;
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
if(tab==='rev'&&isAdmin){$('#app').innerHTML=pend.length?pend.map(r=>`<div class="card pend" style="margin-bottom:8px"><b>${esc(r.name)}</b> <span class="mut">ابن/ابنة ${esc(r.parentId&&byId[r.parentId]?full(r.parentId,4):'—')}</span><div class="mut">${r.birth?'مواليد '+esc(r.birth)+' · ':''}${esc(r.phone||'')} ${esc(r.email||'')} ${esc(r.notes||'')}</div><div class="bar"><button class="p" data-ok="${r.id}">موافقة ونشر</button><button class="d" data-no="${r.id}">رفض</button></div></div>`).join(''):'<div class="card mut">لا توجد طلبات بانتظار المراجعة ✅</div>';return}
const roots=kids['']||[];
$('#app').innerHTML=`<div class="g"><div class="card tree">${roots.length?roots.map(r=>node(r,0)).join(''):'<div class="mut">الشجرة فارغة. '+(isAdmin?'ابدأ بإضافة الجد الأكبر (بدون أب).':'')+'</div>'}</div><div>${detail()}</div></div>`}
function form(o){o=o||{};const par=o.parentId||'';
const ov=document.createElement('div');ov.className='ov';
ov.innerHTML=`<div class="md"><h3 style="margin:0">${o.id?'تعديل':'إضافة'} اسم${isAdmin?'':' <span class="mut" style="font-size:.8rem">(يُنشر بعد موافقة المدير)</span>'}</h3>
<label>الاسم</label><input id="f_n" value="${esc(o.name)}">
<label>الأب / الأم (ابحث ثم اختر)</label><input id="f_ps" placeholder="اكتب جزءاً من الاسم" value="${esc(par&&byId[par]?full(par,3):'')}"><div id="f_pr"></div>
<label>الجنس</label><select id="f_g"><option value="m">ذكر</option><option value="f" ${o.gender==='f'?'selected':''}>أنثى</option></select>
<label>سنة الميلاد (اختياري)</label><input id="f_b" type="number" value="${esc(o.birth||'')}">
<label>الهاتف (اختياري)</label><input id="f_p" type="tel" value="${esc(o.phone)}">
<label>البريد الإلكتروني (اختياري)</label><input id="f_e" type="email" value="${esc(o.email)}">
<label>ملاحظات</label><textarea id="f_t" rows="2">${esc(o.notes)}</textarea>
<div class="bar"><button class="p" id="f_ok">حفظ</button><button id="f_x">إلغاء</button></div></div>`;
document.body.appendChild(ov);let np=par;
ov.querySelector('#f_ps').oninput=e=>{np='';const v=norm(e.target.value);ov.querySelector('#f_pr').innerHTML=v.length<2?'':people.filter(p=>norm(full(p.id,4)).includes(v)).slice(0,6).map(p=>`<div class="res" data-p="${p.id}">${esc(full(p.id,4))}</div>`).join('')};
ov.querySelector('#f_pr').onclick=e=>{const t=e.target.closest('[data-p]');if(!t)return;np=t.dataset.p;ov.querySelector('#f_ps').value=full(np,3);ov.querySelector('#f_pr').innerHTML=''};
ov.querySelector('#f_x').onclick=()=>ov.remove();
ov.querySelector('#f_ok').onclick=async()=>{const name=ov.querySelector('#f_n').value.trim();if(!name)return toast('الاسم مطلوب');
if(!np&&!isAdmin)return toast('اختر الأب أو الأم من القائمة');
if(o.id&&np&&chain(np).some(x=>x.id===o.id))return toast('لا يمكن جعل الشخص تابعاً لأحد أحفاده');
const d={name,parentId:np||'',gender:ov.querySelector('#f_g').value,birth:+ov.querySelector('#f_b').value||null,phone:ov.querySelector('#f_p').value.trim(),email:ov.querySelector('#f_e').value.trim(),notes:ov.querySelector('#f_t').value.trim()};
try{if(o.id){await db.doc('people/'+o.id).set(d)}else if(isAdmin){await db.doc('people/'+crypto.randomUUID().slice(0,8)).set({...d,at:Date.now()})}else{await db.doc('pending/'+crypto.randomUUID().slice(0,8)).set({...d,by:uid,at:Date.now()});toast('أُرسل للمدير للمراجعة ✅')}ov.remove()}catch(e){toast('تعذر الحفظ: لا تملك صلاحية')}}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t],[data-s],[data-add],[data-edit],[data-del],[data-ok],[data-no],[data-tab],#add,#edsite');if(!t)return;const D=t.dataset;
if(D.t){open.has(D.t)?open.delete(D.t):open.add(D.t);render()}
else if(D.s)pick(D.s);
else if(t.id==='add')form({});
else if(t.id==='edsite')siteForm();
else if(D.add)form({parentId:D.add});
else if(D.edit)form(byId[D.edit]);
else if(D.tab){tab=D.tab;render()}
else if(D.del){if((kids[D.del]||[]).length)return toast('لا يمكن حذف اسم له أبناء');if(confirm('حذف هذا الاسم نهائياً؟')){await db.doc('people/'+D.del).delete();sel=null}}
else if(D.ok){const r=pend.find(x=>x.id===D.ok);if(!r)return;const{id,by,...d}=r;await db.doc('people/'+id).set(d);await db.doc('pending/'+id).delete();toast('تم النشر ✅')}
else if(D.no){if(confirm('رفض هذا الطلب؟'))await db.doc('pending/'+D.no).delete()}});
$('#q').oninput=e=>{q=norm(e.target.value);if(q.length<2){$('#res').innerHTML='';return}
const r=people.filter(p=>norm(full(p.id,10)).includes(q)).slice(0,15);
$('#res').innerHTML=`<div class="card" style="margin-bottom:10px">${r.length?r.map(p=>`<div class="res" data-s="${p.id}"><b>${esc(p.name)}</b><div class="mut">${esc(full(p.id,10))}</div></div>`).join(''):'<span class="mut">لا نتائج</span>'}</div>`};
(async()=>{try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
if(!db){$('#who').textContent='يجب فتح الصفحة بحساب مسجّل دخول للوصول إلى البيانات.';return}
try{isAdmin=!!(await user.canEdit())||!!(await user.isOwner());uid=await user.id()}catch(e){}
db.collection('people').onSnapshot(s=>{people=s.docs.map(d=>({id:d.id,...d.data()}));index();render()},()=>toast('تعذر تحميل البيانات'));
db.doc('settings/site').onSnapshot(s=>{site=s.exists?s.data():{};applySite()});
db.collection('pending').onSnapshot(s=>{pend=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);render();if(isAdmin&&pend.length&&!window._n){window._n=1;toast(`لديك ${pend.length} طلب إضافة بانتظار المراجعة`)}})})();
</script></body></html>
