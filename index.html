<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卮噩乇丞 丕賱毓卮賷乇丞</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2418;--mut:#7a6f5d;--ac:#2f6b4f;--acx:#fff;--bd:#e4dccb;--warn:#b5651d;--hl:#e8f2ec}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a16;--card:#262520;--tx:#efe9dc;--mut:#a39a86;--ac:#5fb58b;--acx:#10231a;--bd:#3a3830;--warn:#e0a060;--hl:#25352d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:1000px;margin:0 auto;padding:14px}h1{margin:0;font-size:1.4rem}.sub,.mut{color:var(--mut);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.d{color:#c0392b}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:var(--acx)}
.bd{background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}.tree{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px}.row.sel{background:var(--hl)}
.tg{border:0;background:none;padding:0 4px;width:24px;color:var(--ac)}.nm{cursor:pointer}
.ct{font-size:.72rem;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 10px;cursor:pointer;background:var(--hl)}
.res{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer}.res:hover{background:var(--hl)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.md label{display:block;margin-top:8px;font-size:.85rem;color:var(--mut)}.pend{border:1px dashed var(--warn)}
.rep{background:var(--hl);border-radius:10px;padding:8px 10px;margin-top:8px}
.banner{background:var(--hl);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;margin:10px 0;white-space:pre-wrap}
#toast{position:fixed;bottom:20px;left:0;right:0;text-align:center;z-index:10;pointer-events:none}
#toast span{background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px}
</style></head><body><div class="w">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="lg" style="font-size:2rem">馃尦</span>
<div style="flex:1;min-width:140px"><h1 id="sn">丕爻賲 丕賱毓卮賷乇丞</h1><div class="sub" id="who"></div></div>
<button id="inst" style="display:none">馃摬 鬲孬亘賷鬲 丕賱鬲胤亘賷賯</button>
<button id="edsite" style="display:none">鈿欙笍 鬲毓丿賷賱</button><button id="login">丿禺賵賱 丕賱賲卮乇賮賷賳</button><button id="out" style="display:none">禺乇賵噩</button></div>
<div class="mut" id="iosh" style="display:none">賱賱鬲孬亘賷鬲 毓賱賶 丌賷賮賵賳: 丕囟睾胤 夭乇 丕賱賲卮丕乇賰丞 孬賲 芦廿囟丕賮丞 廿賱賶 丕賱卮丕卮丞 丕賱乇卅賷爻賷丞禄.</div>
<div class="banner" id="bn" style="display:none"></div>
<div class="bar"><input id="q" placeholder="丕亘丨孬 毓賳 丕爻賲 (賲孬丕賱: 賲丨賲丿 亘賳 兀丨賲丿)鈥�" style="flex:1;min-width:200px"><button class="p" id="add" style="display:none">+ 廿囟丕賮丞 丕爻賲</button></div>
<div id="res"></div>
<div class="tabs"><button data-tab="tree" class="on">丕賱卮噩乇丞</button><button data-tab="qa">兀爻卅賱丞 賵乇丿賵丿<span class="bd" id="qc" style="display:none">0</span></button><button data-tab="rev" id="revb" style="display:none">丕賱賲乇丕噩毓丞<span class="bd" id="pc">0</span></button></div>
<div id="app"></div></div><div id="toast"></div>
<script>
// ===== 囟毓 亘賷丕賳丕鬲 賲卮乇賵毓賰 賲賳 Supabase > Project Settings > API =====
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co', SUPABASE_KEY='YOUR-ANON-PUBLIC-KEY';
// ===================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let role='viewer',uid='',session=null,isAdmin=false,isStaff=false,people=[],pend=[],msgs=[],byId={},kids={},open=new Set(),sel=null,tab='tree',memo={},site={},sub=false,notified=false,dip=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[兀廿丌]/g,'丕').replace(/賶/g,'賷').replace(/丞/g,'賴').replace(/\s+/g,' ').trim().toLowerCase();
const toast=m=>{$('#toast').innerHTML='<span>'+esc(m)+'</span>';setTimeout(()=>$('#toast').innerHTML='',3000)};
function index(){byId={};kids={};memo={};people.forEach(p=>byId[p.id]=p);people.forEach(p=>{const k=p.parentId||'';(kids[k]=kids[k]||[]).push(p)});Object.values(kids).forEach(a=>a.sort((x,y)=>(x.birth||9999)-(y.birth||9999)||x.name.localeCompare(y.name,'ar')))}
function chain(id){const a=[];let c=byId[id],g=0;while(c&&g++<500){a.push(c);c=byId[c.parentId]}return a}
function full(id,n=5){const c=chain(id).slice(0,n);return c.map((p,i)=>i?(c[i-1].gender==='f'?' 亘賳鬲 ':' 亘賳 ')+p.name:p.name).join('')}
function cnt(id){if(memo[id]!=null)return memo[id];let n=0;(kids[id]||[]).forEach(c=>n+=1+cnt(c.id));return memo[id]=n}
function pick(id){sel=id;chain(id).slice(1).forEach(p=>open.add(p.id));tab='tree';$('#res').innerHTML='';render()}
function node(p,d){const k=kids[p.id]||[],o=open.has(p.id);
let h=`<div style="margin-inline-start:${d?16:0}px"><div class="row ${sel===p.id?'sel':''}"><button class="tg" data-t="${p.id}">${k.length?(o?'鈻�':'鈼�'):'鈥�'}</button><span class="nm" data-s="${p.id}">${esc(p.name)}</span>${k.length?`<span class="ct">${cnt(p.id)}</span>`:''}</div>`;
if(o)h+=k.map(c=>node(c,d+1)).join('');return h+'</div>'}
function detail(){const p=byId[sel];if(!p)return `<div class="card mut">丕禺鬲乇 丕爻賲丕賸 賲賳 丕賱卮噩乇丞 兀賵 丕賱亘丨孬 賱毓乇囟 賳爻亘賴 賵亘賷丕賳丕鬲賴.</div>`;
const path=chain(sel).reverse(),k=kids[sel]||[];
return `<div class="card"><h3 style="margin:0">${esc(p.name)}</h3><div class="mut">${esc(full(sel,8))}</div>
<b>丕賱賳爻亘 (賲賳 丕賱噩匕乇):</b><div class="chips">${path.map((x,i)=>`<span class="chip" data-s="${x.id}">${esc(x.name)}</span>${i<path.length-1?'鈫�':''}`).join('')}</div>
<div>${p.gender==='f'?'兀賳孬賶':'匕賰乇'}${p.birth?' 路 賲賵丕賱賷丿 '+esc(p.birth):''} 路 毓丿丿 丕賱兀亘賳丕亍 賵丕賱兀丨賮丕丿: ${cnt(sel)}</div>
${p.phone?`<div>馃摓 <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div>`:''}${p.email?`<div>鉁夛笍 <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>`:''}${p.notes?`<div class="mut">${esc(p.notes)}</div>`:''}
${k.length?`<b>丕賱兀亘賳丕亍:</b><div class="chips">${k.map(c=>`<span class="chip" data-s="${c.id}">${esc(c.name)}</span>`).join('')}</div>`:''}
<div class="bar">${isStaff?`<button class="p" data-add="${p.id}">+ 廿囟丕賮丞 丕亘賳/丕亘賳丞</button>`:''}${isAdmin?`<button data-edit="${p.id}">鬲毓丿賷賱</button><button class="d" data-del="${p.id}">丨匕賮</button>`:''}</div></div>`}
function qaView(){return `<div class="bar"><button class="p" id="msg">鉁夛笍 兀乇爻賱 爻丐丕賱丕賸 兀賵 賲毓賱賵賲丞</button></div><div class="mut" style="margin-bottom:8px">鬲馗賴乇 丕賱乇爻丕卅賱 亘毓丿 賲乇丕噩毓鬲賴丕. 賱賱鬲賵丕氐賱 丕賱卮禺氐賷 丕爻鬲禺丿賲 亘賷丕賳丕鬲 丕賱鬲賵丕氐賱 賮賷 亘胤丕賯丞 丕賱卮禺氐.</div>`+
(msgs.length?msgs.map(m=>`<div class="card ${m.status==='pending'?'pend':''}" style="margin-bottom:8px"><div class="mut">${esc(m.name||'夭丕卅乇')} 路 ${new Date(m.created_at).toLocaleDateString('ar')}${m.status==='pending'?' 路 <b style="color:var(--warn)">亘丕賳鬲馗丕乇 丕賱賲賵丕賮賯丞</b>':''}</div><div style="white-space:pre-wrap">${esc(m.body)}</div>
${m.reply?`<div class="rep"><b>${m.replied_by_role==='admin'?'丕賱賲丿賷乇':'賲卮乇賮'}:</b> <span style="white-space:pre-wrap">${esc(m.reply)}</span></div>`:''}
${isStaff?`<div class="bar">${m.status==='pending'?`<button class="p" data-mok="${m.id}">賲賵丕賮賯丞 賵賳卮乇</button>`:''}<button data-rep="${m.id}">${m.reply?'鬲毓丿賷賱 丕賱乇丿':'乇丿'}</button>${isAdmin?`<button class="d" data-mdel="${m.id}">丨匕賮</button>`:''}</div>`:''}</div>`).join(''):'<div class="card mut">賱丕 鬲賵噩丿 乇爻丕卅賱 亘毓丿.</div>')}
function applySite(){const n=site.name||'丕爻賲 丕賱毓卮賷乇丞';$('#sn').textContent=n;document.title=n;
$('#lg').innerHTML=site.logo?`<img src="${esc(site.logo)}" alt="" style="height:46px;width:46px;object-fit:cover;border-radius:12px">`:esc(site.emoji||'馃尦');
const b=$('#bn');b.style.display=site.banner?'':'none';b.textContent=site.banner||'';$('#edsite').style.display=isAdmin?'':'none'}
function render(){applySite();
$('#who').textContent=`${people.length} 丕爻賲${isAdmin?' 路 兀賳鬲: 丕賱賲丿賷乇':role==='moderator'?' 路 兀賳鬲: 賲卮乇賮 (丕賱廿囟丕賮丕鬲 鬲購賳卮乇 亘毓丿 賲賵丕賮賯丞 丕賱賲丿賷乇)':''}`;
$('#revb').style.display=isAdmin?'':'none';$('#pc').textContent=pend.length;$('#add').style.display=isStaff?'':'none';
const pm=isStaff?msgs.filter(m=>m.status==='pending').length:0;$('#qc').textContent=pm;$('#qc').style.display=pm?'':'none';
$('#login').style.display=session?'none':'';$('#out').style.display=session?'':'none';
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
if(tab==='qa'){$('#app').innerHTML=qaView();return}
if(tab==='rev'&&isAdmin){$('#app').innerHTML=pend.length?pend.map(r=>`<div class="card pend" style="margin-bottom:8px"><b>${esc(r.name)}</b> <span class="mut">丕亘賳/丕亘賳丞 ${esc(r.parentId&&byId[r.parentId]?full(r.parentId,4):'鈥�')}</span><div class="mut">${r.birth?'賲賵丕賱賷丿 '+esc(r.birth)+' 路 ':''}${esc(r.phone||'')} ${esc(r.email||'')} ${esc(r.notes||'')}</div><div class="bar"><button class="p" data-ok="${r.id}">賲賵丕賮賯丞 賵賳卮乇</button><button class="d" data-no="${r.id}">乇賮囟</button></div></div>`).join(''):'<div class="card mut">賱丕 鬲賵噩丿 胤賱亘丕鬲 亘丕賳鬲馗丕乇 丕賱賲乇丕噩毓丞 鉁�</div>';return}
const roots=kids['']||[];
$('#app').innerHTML=`<div class="g"><div class="card tree">${roots.length?roots.map(r=>node(r,0)).join(''):'<div class="mut">丕賱卮噩乇丞 賮丕乇睾丞. '+(isAdmin?'丕亘丿兀 亘廿囟丕賮丞 丕賱噩丿 丕賱兀賰亘乇 (亘丿賵賳 兀亘).':'')+'</div>'}</div><div>${detail()}</div></div>`}
function overlay(html){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="md">${html}</div>`;document.body.appendChild(ov);ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ov.remove());return ov}
function form(o){o=o||{};const par=o.parentId||'';
const ov=overlay(`<h3 style="margin:0">${o.id?'鬲毓丿賷賱':'廿囟丕賮丞'} 丕爻賲${isAdmin?'':' <span class="mut">(賷購賳卮乇 亘毓丿 賲賵丕賮賯丞 丕賱賲丿賷乇)</span>'}</h3>
<label>丕賱丕爻賲</label><input id="f_n" value="${esc(o.name)}">
<label>丕賱兀亘 / 丕賱兀賲 (丕亘丨孬 孬賲 丕禺鬲乇)</label><input id="f_ps" placeholder="丕賰鬲亘 噩夭亍丕賸 賲賳 丕賱丕爻賲" value="${esc(par&&byId[par]?full(par,3):'')}"><div id="f_pr"></div>
<label>丕賱噩賳爻</label><select id="f_g"><option value="m">匕賰乇</option><option value="f" ${o.gender==='f'?'selected':''}>兀賳孬賶</option></select>
<label>爻賳丞 丕賱賲賷賱丕丿 (丕禺鬲賷丕乇賷)</label><input id="f_b" type="number" value="${esc(o.birth||'')}">
<label>丕賱賴丕鬲賮 (丕禺鬲賷丕乇賷貙 賷馗賴乇 賱賱噩賲賷毓)</label><input id="f_p" type="tel" value="${esc(o.phone)}">
<label>丕賱亘乇賷丿 丕賱廿賱賰鬲乇賵賳賷 (丕禺鬲賷丕乇賷貙 賷馗賴乇 賱賱噩賲賷毓)</label><input id="f_e" type="email" value="${esc(o.email)}">
<label>賲賱丕丨馗丕鬲</label><textarea id="f_t" rows="2">${esc(o.notes)}</textarea>
<div class="bar"><button class="p" id="f_ok">丨賮馗</button><button data-x>廿賱睾丕亍</button></div>`);let np=par;
ov.querySelector('#f_ps').oninput=e=>{np='';const v=norm(e.target.value);ov.querySelector('#f_pr').innerHTML=v.length<2?'':people.filter(p=>norm(full(p.id,4)).includes(v)).slice(0,6).map(p=>`<div class="res" data-p="${p.id}">${esc(full(p.id,4))}</div>`).join('')};
ov.querySelector('#f_pr').onclick=e=>{const t=e.target.closest('[data-p]');if(!t)return;np=t.dataset.p;ov.querySelector('#f_ps').value=full(np,3);ov.querySelector('#f_pr').innerHTML=''};
ov.querySelector('#f_ok').onclick=async()=>{const v=s=>ov.querySelector(s).value.trim(),name=v('#f_n');if(!name)return toast('丕賱丕爻賲 賲胤賱賵亘');
if(!np&&!isAdmin)return toast('丕禺鬲乇 丕賱兀亘 兀賵 丕賱兀賲 賲賳 丕賱賯丕卅賲丞');
if(o.id&&np&&chain(np).some(x=>x.id===o.id))return toast('賱丕 賷賲賰賳 噩毓賱 丕賱卮禺氐 鬲丕亘毓丕賸 賱兀丨丿 兀丨賮丕丿賴');
const d={name,parent_id:np||null,gender:v('#f_g'),birth:+v('#f_b')||null,phone:v('#f_p')||null,email:v('#f_e')||null,notes:v('#f_t')||null};
const r=o.id?await sb.from('people').update(d).eq('id',o.id):await sb.from('people').insert({...d,status:isAdmin?'approved':'pending'});
if(r.error)return toast('鬲毓匕乇 丕賱丨賮馗: '+r.error.message);
if(!o.id&&!isAdmin)toast('兀購乇爻賱 賱賱賲丿賷乇 賱賱賲乇丕噩毓丞 鉁�');ov.remove();load()}}
function siteForm(){const ov=overlay(`<h3 style="margin:0">廿毓丿丕丿丕鬲 丕賱賲賳氐丞</h3><label>丕爻賲 丕賱毓卮賷乇丞</label><input id="s_n" value="${esc(site.name)}"><label>丕賱卮毓丕乇 (廿賷賲賵噩賷)</label><input id="s_e" value="${esc(site.emoji||'馃尦')}"><label>兀賵 乇丕亘胤 氐賵乇丞 丕賱卮毓丕乇 (丕禺鬲賷丕乇賷)</label><input id="s_l" dir="ltr" placeholder="https://..." value="${esc(site.logo)}"><label>賳氐 丕賱卮乇賷胤 丕賱毓賱賵賷: 賳亘匕丞 兀賵 鬲賵噩賷賴 (賮丕乇睾 = 廿禺賮丕亍)</label><textarea id="s_b" rows="4">${esc(site.banner)}</textarea><div class="bar"><button class="p" id="s_ok">丨賮馗</button><button data-x>廿賱睾丕亍</button></div>`);
ov.querySelector('#s_ok').onclick=async()=>{const v=s=>ov.querySelector(s).value.trim();
const r=await sb.from('site').upsert({id:1,name:v('#s_n'),emoji:v('#s_e')||'馃尦',logo:v('#s_l'),banner:v('#s_b')});
if(r.error)return toast('鬲毓匕乇 丕賱丨賮馗');ov.remove();load()}}
function msgForm(){const ov=overlay(`<h3 style="margin:0">兀乇爻賱 爻丐丕賱丕賸 兀賵 賲毓賱賵賲丞</h3><div class="mut">鬲馗賴乇 丕賱乇爻丕賱丞 賱賱噩賲賷毓 亘毓丿 賲乇丕噩毓鬲賴丕貙 賵賷購乇丿 毓賱賷賴丕 賮賷 賳賮爻 丕賱賲賰丕賳.</div>
<label>丕賱丕爻賲 (丕禺鬲賷丕乇賷)</label><input id="m_n" maxlength="60"><label>丕賱乇爻丕賱丞</label><textarea id="m_b" rows="5" maxlength="1000"></textarea>
<input id="m_h" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px">
<div class="bar"><button class="p" id="m_ok">廿乇爻丕賱</button><button data-x>廿賱睾丕亍</button></div>`);
ov.querySelector('#m_ok').onclick=async()=>{const body=ov.querySelector('#m_b').value.trim(),name=ov.querySelector('#m_n').value.trim();
if(body.length<3)return toast('丕賰鬲亘 乇爻丕賱丞 兀胤賵賱');
if(ov.querySelector('#m_h').value){ov.remove();return toast('鬲賲 丕賱廿乇爻丕賱 鉁�')}
try{if(Date.now()-(+localStorage.getItem('clan_last')||0)<60000)return toast('丕賳鬲馗乇 丿賯賷賯丞 賯亘賱 廿乇爻丕賱 乇爻丕賱丞 兀禺乇賶')}catch(e){}
const r=await sb.from('messages').insert({name:name||null,body});
if(r.error)return toast('鬲毓匕乇 丕賱廿乇爻丕賱貙 丨丕賵賱 賱丕丨賯丕賸');

document.addEventListener('click',async e=>{const t=e.target.closest('[data-t],[data-s],[data-add],[data-edit],[data-del],[data-ok],[data-no],[data-tab],[data-mok],[data-rep],[data-mdel],#add,#edsite,#out,#login,#msg');if(!t)return;const D=t.dataset;
if(D.t){open.has(D.t)?open.delete(D.t):open.add(D.t);render()}
else if(D.s)pick(D.s);
else if(t.id==='add')form({});
else if(t.id==='edsite')siteForm();
else if(t.id==='login')loginForm();
else if(t.id==='msg')msgForm();
else if(t.id==='out'){await sb.auth.signOut();session=null;role='viewer';isAdmin=isStaff=false;tab='tree';await load()}
else if(D.add)form({parentId:D.add});

else if(D.del){if(confirm('丨匕賮 賴匕丕 丕賱丕爻賲 賳賴丕卅賷丕賸責')){const r=await sb.from('people').delete().eq('id',D.del);if(r.error)toast('賱丕 賷賲賰賳 丨匕賮 丕爻賲 賱賴 兀亘賳丕亍');else{sel=null;load()}}}
else if(D.ok){await sb.from('people').update({status:'approved'}).eq('id',D.ok);toast('鬲賲 丕賱賳卮乇 鉁�');load()}
else if(D.no){if(confirm('乇賮囟 賴匕丕 丕賱胤賱亘責')){await sb.from('people').delete().eq('id',D.no);load()}}
else if(D.mok){await sb.from('messages').update({status:'approved'}).eq('id',D.mok);toast('鬲賲 賳卮乇 丕賱乇爻丕賱丞 鉁�');load()}
else if(D.rep)repForm(msgs.find(m=>m.id===D.rep));
else if(D.mdel){if(confirm('丨匕賮 賴匕賴 丕賱乇爻丕賱丞 賳賴丕卅賷丕賸責')){await sb.from('messages').delete().eq('id',D.mdel);load()}}});

async function load(){let all,st,ms;
try{const[a,b,c]=await Promise.all([sb.from('people').select('*'),sb.from('site').select('*').eq('id',1).maybeSingle(),sb.from('messages').select('*').order('created_at',{ascending:false})]);
if(a.error)throw a.error;all=a.data;st=b.data||{};ms=c.data||[];
try{localStorage.setItem('clan_cache',JSON.stringify({all,st,ms,pub:!isStaff}))}catch(e){}}
catch(e){try{const c=JSON.parse(localStorage.getItem('clan_cache'));all=c.all;st=c.st;ms=c.ms;toast('賱丕 賷賵噩丿 丕鬲氐丕賱: 鬲購毓乇囟 丌禺乇 亘賷丕賳丕鬲 賲丨賮賵馗丞')}catch(_){return toast('鬲毓匕乇 鬲丨賲賷賱 丕賱亘賷丕賳丕鬲')}}
all=all.map(r=>({...r,parentId:r.parent_id||''}));
people=all.filter(r=>r.status==='approved');pend=isAdmin?all.filter(r=>r.status==='pending').sort((x,y)=>x.created_at>y.created_at?1:-1):[];
msgs=ms;site=st;index();render();
if(isStaff&&!notified){const n=pend.length+msgs.filter(m=>m.status==='pending').length;if(n){notified=true;toast(`賱丿賷賰 ${n} 毓賳氐乇 亘丕賳鬲馗丕乇 丕賱賲乇丕噩毓丞`)}}}
async function boot(){const{data:{session:s}}=await sb.auth.getSession();session=s;role='viewer';
if(s){uid=s.user.id;const pr=await sb.from('profiles').select('role').eq('id',uid).maybeSingle();role=pr.data?.role||'viewer'}
isAdmin=role==='admin';isStaff=isAdmin||role==='moderator';await load();
if(!sub){sub=true;sb.channel('people-ch').on('postgres_changes',{event:'*',schema:'public',table:'people'},()=>load()).subscribe()}}
