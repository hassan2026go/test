<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2418;--mut:#7a6f5d;--ac:#2f6b4f;--acx:#fff;--bd:#e4dccb;--warn:#b5651d;--hl:#e8f2ec}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a16;--card:#262520;--tx:#efe9dc;--mut:#a39a86;--ac:#5fb58b;--acx:#10231a;--bd:#3a3830;--warn:#e0a060;--hl:#25352d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:1000px;margin:0 auto;padding:14px}h1{margin:0;font-size:1.4rem}.sub,.mut{color:var(--mut);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.d{color:#c0392b}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:var(--acx)}
.bd{background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}.tree{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px}.row.sel{background:var(--hl)}
.tg{border:0;background:none;padding:0 4px;width:24px;color:var(--ac)}.nm{cursor:pointer}
.ct{font-size:.72rem;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 10px;cursor:pointer;background:var(--hl)}
.res{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer}.res:hover{background:var(--hl)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto}

.rep{background:var(--hl);border-radius:10px;padding:8px 10px;margin-top:8px}

</style></head><body><div class="w">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span id="lg" style="font-size:2rem">&#x1F333;</span>
<div style="flex:1;min-width:140px"><h1 id="sn">&#x627;&#x633;&#x645; &#x627;&#x644;&#x639;&#x634;&#x64A;&#x631;&#x629;</h1><div class="sub" id="who"></div></div>
<button id="inst" style="display:none">&#x1F4F2; &#x62A;&#x62B;&#x628;&#x64A;&#x62A; &#x627;&#x644;&#x62A;&#x637;&#x628;&#x64A;&#x642;</button>
<button id="edsite" style="display:none">&#x2699;&#xFE0F; &#x62A;&#x639;&#x62F;&#x64A;&#x644;</button><button id="login">&#x62F;&#x62E;&#x648;&#x644; &#x627;&#x644;&#x645;&#x634;&#x631;&#x641;&#x64A;&#x646;</button><button id="out" style="display:none">&#x62E;&#x631;&#x648;&#x62C;</button></div>
<div class="mut" id="iosh" style="display:none">&#x644;&#x644;&#x62A;&#x62B;&#x628;&#x64A;&#x62A; &#x639;&#x644;&#x649; &#x622;&#x64A;&#x641;&#x648;&#x646;: &#x627;&#x636;&#x63A;&#x637; &#x632;&#x631; &#x627;&#x644;&#x645;&#x634;&#x627;&#x631;&#x643;&#x629; &#x62B;&#x645; &#xAB;&#x625;&#x636;&#x627;&#x641;&#x629; &#x625;&#x644;&#x649; &#x627;&#x644;&#x634;&#x627;&#x634;&#x629; &#x627;&#x644;&#x631;&#x626;&#x64A;&#x633;&#x64A;&#x629;&#xBB;.</div>
<div class="banner" id="bn" style="display:none"></div>
<div class="bar"><input id="q" placeholder="&#x627;&#x628;&#x62D;&#x62B; &#x639;&#x646; &#x627;&#x633;&#x645; (&#x645;&#x62B;&#x627;&#x644;: &#x645;&#x62D;&#x645;&#x62F; &#x628;&#x646; &#x623;&#x62D;&#x645;&#x62F;)&#x2026;" style="flex:1;min-width:200px"><button class="p" id="add" style="display:none">+ &#x625;&#x636;&#x627;&#x641;&#x629; &#x627;&#x633;&#x645;</button></div>
<div id="res"></div>
<div class="tabs"><button data-tab="tree" class="on">&#x627;&#x644;&#x634;&#x62C;&#x631;&#x629;</button><button data-tab="qa">&#x623;&#x633;&#x626;&#x644;&#x629; &#x648;&#x631;&#x62F;&#x648;&#x62F;<span class="bd" id="qc" style="display:none">0</span></button><button data-tab="rev" id="revb" style="display:none">&#x627;&#x644;&#x645;&#x631;&#x627;&#x62C;&#x639;&#x629;<span class="bd" id="pc">0</span></button></div>
<div id="app"></div></div><div id="toast"></div>
<script>
// ===== \u0636\u0639 \u0628\u064a\u0627\u0646\u0627\u062a \u0645\u0634\u0631\u0648\u0639\u0643 \u0645\u0646 Supabase > Project Settings > API =====
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co', SUPABASE_KEY='YOUR-ANON-PUBLIC-KEY';
// ===================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let role='viewer',uid='',session=null,isAdmin=false,isStaff=false,people=[],pend=[],msgs=[],byId={},kids={},open=new Set(),sel=null,tab='tree',memo={},site={},sub=false,notified=false,dip=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[\u0623\u0625\u0622]/g,'\u0627').replace(/\u0649/g,'\u064a').replace(/\u0629/g,'\u0647').replace(/\s+/g,' ').trim().toLowerCase();
const toast=m=>{$('#toast').innerHTML='<span>'+esc(m)+'</span>';setTimeout(()=>$('#toast').innerHTML='',3000)};
function index(){byId={};kids={};memo={};people.forEach(p=>byId[p.id]=p);people.forEach(p=>{const k=p.parentId||'';(kids[k]=kids[k]||[]).push(p)});Object.values(kids).forEach(a=>a.sort((x,y)=>(x.birth||9999)-(y.birth||9999)||x.name.localeCompare(y.name,'ar')))}
function chain(id){const a=[];let c=byId[id],g=0;while(c&&g++<500){a.push(c);c=byId[c.parentId]}return a}
function full(id,n=5){const c=chain(id).slice(0,n);return c.map((p,i)=>i?(c[i-1].gender==='f'?' \u0628\u0646\u062a ':' \u0628\u0646 ')+p.name:p.name).join('')}
function cnt(id){if(memo[id]!=null)return memo[id];let n=0;(kids[id]||[]).forEach(c=>n+=1+cnt(c.id));return memo[id]=n}
function pick(id){sel=id;chain(id).slice(1).forEach(p=>open.add(p.id));tab='tree';$('#res').innerHTML='';render()}
function node(p,d){const k=kids[p.id]||[],o=open.has(p.id);
let h=`<div style="margin-inline-start:${d?16:0}px"><div class="row ${sel===p.id?'sel':''}"><button class="tg" data-t="${p.id}">${k.length?(o?'\u25be':'\u25c2'):'\u2022'}</button><span class="nm" data-s="${p.id}">${esc(p.name)}</span>${k.length?`<span class="ct">${cnt(p.id)}</span>`:''}</div>`;
if(o)h+=k.map(c=>node(c,d+1)).join('');return h+'</div>'}
function detail(){const p=byId[sel];if(!p)return `<div class="card mut">\u0627\u062e\u062a\u0631 \u0627\u0633\u0645\u0627\u064b \u0645\u0646 \u0627\u0644\u0634\u062c\u0631\u0629 \u0623\u0648 \u0627\u0644\u0628\u062d\u062b \u0644\u0639\u0631\u0636 \u0646\u0633\u0628\u0647 \u0648\u0628\u064a\u0627\u0646\u0627\u062a\u0647.</div>`;
const path=chain(sel).reverse(),k=kids[sel]||[];
return `<div class="card"><h3 style="margin:0">${esc(p.name)}</h3><div class="mut">${esc(full(sel,8))}</div>
<b>\u0627\u0644\u0646\u0633\u0628 (\u0645\u0646 \u0627\u0644\u062c\u0630\u0631):</b><div class="chips">${path.map((x,i)=>`<span class="chip" data-s="${x.id}">${esc(x.name)}</span>${i<path.length-1?'\u2190':''}`).join('')}</div>
<div>${p.gender==='f'?'\u0623\u0646\u062b\u0649':'\u0630\u0643\u0631'}${p.birth?' \u00b7 \u0645\u0648\u0627\u0644\u064a\u062f '+esc(p.birth):''} \u00b7 \u0639\u062f\u062f \u0627\u0644\u0623\u0628\u0646\u0627\u0621 \u0648\u0627\u0644\u0623\u062d\u0641\u0627\u062f: ${cnt(sel)}</div>
${p.phone?`<div>\ud83d\udcde <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div>`:''}${p.email?`<div>\u2709\ufe0f <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>`:''}${p.notes?`<div class="mut">${esc(p.notes)}</div>`:''}
${k.length?`<b>\u0627\u0644\u0623\u0628\u0646\u0627\u0621:</b><div class="chips">${k.map(c=>`<span class="chip" data-s="${c.id}">${esc(c.name)}</span>`).join('')}</div>`:''}
<div class="bar">${isStaff?`<button class="p" data-add="${p.id}">+ \u0625\u0636\u0627\u0641\u0629 \u0627\u0628\u0646/\u0627\u0628\u0646\u0629</button>`:''}${isAdmin?`<button data-edit="${p.id}">\u062a\u0639\u062f\u064a\u0644</button><button class="d" data-del="${p.id}">\u062d\u0630\u0641</button>`:''}</div></div>`}
function qaView(){return `<div class="bar"><button class="p" id="msg">\u2709\ufe0f \u0623\u0631\u0633\u0644 \u0633\u0624\u0627\u0644\u0627\u064b \u0623\u0648 \u0645\u0639\u0644\u0648\u0645\u0629</button></div><div class="mut" style="margin-bottom:8px">\u062a\u0638\u0647\u0631 \u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0628\u0639\u062f \u0645\u0631\u0627\u062c\u0639\u062a\u0647\u0627. \u0644\u0644\u062a\u0648\u0627\u0635\u0644 \u0627\u0644\u0634\u062e\u0635\u064a \u0627\u0633\u062a\u062e\u062f\u0645 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u062a\u0648\u0627\u0635\u0644 \u0641\u064a \u0628\u0637\u0627\u0642\u0629 \u0627\u0644\u0634\u062e\u0635.</div>`+
(msgs.length?msgs.map(m=>`<div class="card ${m.status==='pending'?'pend':''}" style="margin-bottom:8px"><div class="mut">${esc(m.name||'\u0632\u0627\u0626\u0631')} \u00b7 ${new Date(m.created_at).toLocaleDateString('ar')}${m.status==='pending'?' \u00b7 <b style="color:var(--warn)">\u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0645\u0648\u0627\u0641\u0642\u0629</b>':''}</div><div style="white-space:pre-wrap">${esc(m.body)}</div>
${m.reply?`<div class="rep"><b>${m.replied_by_role==='admin'?'\u0627\u0644\u0645\u062f\u064a\u0631':'\u0645\u0634\u0631\u0641'}:</b> <span style="white-space:pre-wrap">${esc(m.reply)}</span></div>`:''}
${isStaff?`<div class="bar">${m.status==='pending'?`<button class="p" data-mok="${m.id}">\u0645\u0648\u0627\u0641\u0642\u0629 \u0648\u0646\u0634\u0631</button>`:''}<button data-rep="${m.id}">${m.reply?'\u062a\u0639\u062f\u064a\u0644 \u0627\u0644\u0631\u062f':'\u0631\u062f'}</button>${isAdmin?`<button class="d" data-mdel="${m.id}">\u062d\u0630\u0641</button>`:''}</div>`:''}</div>`).join(''):'<div class="card mut">\u0644\u0627 \u062a\u0648\u062c\u062f \u0631\u0633\u0627\u0626\u0644 \u0628\u0639\u062f.</div>')}
function applySite(){const n=site.name||'\u0627\u0633\u0645 \u0627\u0644\u0639\u0634\u064a\u0631\u0629';$('#sn').textContent=n;document.title=n;
$('#lg').innerHTML=site.logo?`<img src="${esc(site.logo)}" alt="" style="height:46px;width:46px;object-fit:cover;border-radius:12px">`:esc(site.emoji||'\ud83c\udf33');
const b=$('#bn');b.style.display=site.banner?'':'none';b.textContent=site.banner||'';$('#edsite').style.display=isAdmin?'':'none'}
function render(){applySite();
$('#who').textContent=`${people.length} \u0627\u0633\u0645${isAdmin?' \u00b7 \u0623\u0646\u062a: \u0627\u0644\u0645\u062f\u064a\u0631':role==='moderator'?' \u00b7 \u0623\u0646\u062a: \u0645\u0634\u0631\u0641 (\u0627\u0644\u0625\u0636\u0627\u0641\u0627\u062a \u062a\u064f\u0646\u0634\u0631 \u0628\u0639\u062f \u0645\u0648\u0627\u0641\u0642\u0629 \u0627\u0644\u0645\u062f\u064a\u0631)':''}`;
$('#revb').style.display=isAdmin?'':'none';$('#pc').textContent=pend.length;$('#add').style.display=isStaff?'':'none';
const pm=isStaff?msgs.filter(m=>m.status==='pending').length:0;$('#qc').textContent=pm;$('#qc').style.display=pm?'':'none';
$('#login').style.display=session?'none':'';$('#out').style.display=session?'':'none';
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
if(tab==='qa'){$('#app').innerHTML=qaView();return}
if(tab==='rev'&&isAdmin){$('#app').innerHTML=pend.length?pend.map(r=>`<div class="card pend" style="margin-bottom:8px"><b>${esc(r.name)}</b> <span class="mut">\u0627\u0628\u0646/\u0627\u0628\u0646\u0629 ${esc(r.parentId&&byId[r.parentId]?full(r.parentId,4):'\u2014')}</span><div class="mut">${r.birth?'\u0645\u0648\u0627\u0644\u064a\u062f '+esc(r.birth)+' \u00b7 ':''}${esc(r.phone||'')} ${esc(r.email||'')} ${esc(r.notes||'')}</div><div class="bar"><button class="p" data-ok="${r.id}">\u0645\u0648\u0627\u0641\u0642\u0629 \u0648\u0646\u0634\u0631</button><button class="d" data-no="${r.id}">\u0631\u0641\u0636</button></div></div>`).join(''):'<div class="card mut">\u0644\u0627 \u062a\u0648\u062c\u062f \u0637\u0644\u0628\u0627\u062a \u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u2705</div>';return}
const roots=kids['']||[];
$('#app').innerHTML=`<div class="g"><div class="card tree">${roots.length?roots.map(r=>node(r,0)).join(''):'<div class="mut">\u0627\u0644\u0634\u062c\u0631\u0629 \u0641\u0627\u0631\u063a\u0629. '+(isAdmin?'\u0627\u0628\u062f\u0623 \u0628\u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u062c\u062f \u0627\u0644\u0623\u0643\u0628\u0631 (\u0628\u062f\u0648\u0646 \u0623\u0628).':'')+'</div>'}</div><div>${detail()}</div></div>`}
function overlay(html){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="md">${html}</div>`;document.body.appendChild(ov);ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ov.remove());return ov}
function form(o){o=o||{};const par=o.parentId||'';
const ov=overlay(`<h3 style="margin:0">${o.id?'\u062a\u0639\u062f\u064a\u0644':'\u0625\u0636\u0627\u0641\u0629'} \u0627\u0633\u0645${isAdmin?'':' <span class="mut">(\u064a\u064f\u0646\u0634\u0631 \u0628\u0639\u062f \u0645\u0648\u0627\u0641\u0642\u0629 \u0627\u0644\u0645\u062f\u064a\u0631)</span>'}</h3>
<label>\u0627\u0644\u0627\u0633\u0645</label><input id="f_n" value="${esc(o.name)}">
<label>\u0627\u0644\u0623\u0628 / \u0627\u0644\u0623\u0645 (\u0627\u0628\u062d\u062b \u062b\u0645 \u0627\u062e\u062a\u0631)</label><input id="f_ps" placeholder="\u0627\u0643\u062a\u0628 \u062c\u0632\u0621\u0627\u064b \u0645\u0646 \u0627\u0644\u0627\u0633\u0645" value="${esc(par&&byId[par]?full(par,3):'')}"><div id="f_pr"></div>
<label>\u0627\u0644\u062c\u0646\u0633</label><select id="f_g"><option value="m">\u0630\u0643\u0631</option><option value="f" ${o.gender==='f'?'selected':''}>\u0623\u0646\u062b\u0649</option></select>
<label>\u0633\u0646\u0629 \u0627\u0644\u0645\u064a\u0644\u0627\u062f (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)</label><input id="f_b" type="number" value="${esc(o.birth||'')}">
<label>\u0627\u0644\u0647\u0627\u062a\u0641 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a\u060c \u064a\u0638\u0647\u0631 \u0644\u0644\u062c\u0645\u064a\u0639)</label><input id="f_p" type="tel" value="${esc(o.phone)}">
<label>\u0627\u0644\u0628\u0631\u064a\u062f \u0627\u0644\u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a (\u0627\u062e\u062a\u064a\u0627\u0631\u064a\u060c \u064a\u0638\u0647\u0631 \u0644\u0644\u062c\u0645\u064a\u0639)</label><input id="f_e" type="email" value="${esc(o.email)}">
<label>\u0645\u0644\u0627\u062d\u0638\u0627\u062a</label><textarea id="f_t" rows="2">${esc(o.notes)}</textarea>
<div class="bar"><button class="p" id="f_ok">\u062d\u0641\u0638</button><button data-x>\u0625\u0644\u063a\u0627\u0621</button></div>`);let np=par;
ov.querySelector('#f_ps').oninput=e=>{np='';const v=norm(e.target.value);ov.querySelector('#f_pr').innerHTML=v.length<2?'':people.filter(p=>norm(full(p.id,4)).includes(v)).slice(0,6).map(p=>`<div class="res" data-p="${p.id}">${esc(full(p.id,4))}</div>`).join('')};
ov.querySelector('#f_pr').onclick=e=>{const t=e.target.closest('[data-p]');if(!t)return;np=t.dataset.p;ov.querySelector('#f_ps').value=full(np,3);ov.querySelector('#f_pr').innerHTML=''};
ov.querySelector('#f_ok').onclick=async()=>{const v=s=>ov.querySelector(s).value.trim(),name=v('#f_n');if(!name)return toast('\u0627\u0644\u0627\u0633\u0645 \u0645\u0637\u0644\u0648\u0628');
if(!np&&!isAdmin)return toast('\u0627\u062e\u062a\u0631 \u0627\u0644\u0623\u0628 \u0623\u0648 \u0627\u0644\u0623\u0645 \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629');
if(o.id&&np&&chain(np).some(x=>x.id===o.id))return toast('\u0644\u0627 \u064a\u0645\u0643\u0646 \u062c\u0639\u0644 \u0627\u0644\u0634\u062e\u0635 \u062a\u0627\u0628\u0639\u0627\u064b \u0644\u0623\u062d\u062f \u0623\u062d\u0641\u0627\u062f\u0647');
const d={name,parent_id:np||null,gender:v('#f_g'),birth:+v('#f_b')||null,phone:v('#f_p')||null,email:v('#f_e')||null,notes:v('#f_t')||null};
const r=o.id?await sb.from('people').update(d).eq('id',o.id):await sb.from('people').insert({...d,status:isAdmin?'approved':'pending'});
if(r.error)return toast('\u062a\u0639\u0630\u0631 \u0627\u0644\u062d\u0641\u0638: '+r.error.message);
if(!o.id&&!isAdmin)toast('\u0623\u064f\u0631\u0633\u0644 \u0644\u0644\u0645\u062f\u064a\u0631 \u0644\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u2705');ov.remove();load()}}
function siteForm(){const ov=overlay(`<h3 style="margin:0">\u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0627\u0644\u0645\u0646\u0635\u0629</h3><label>\u0627\u0633\u0645 \u0627\u0644\u0639\u0634\u064a\u0631\u0629</label><input id="s_n" value="${esc(site.name)}"><label>\u0627\u0644\u0634\u0639\u0627\u0631 (\u0625\u064a\u0645\u0648\u062c\u064a)</label><input id="s_e" value="${esc(site.emoji||'\ud83c\udf33')}"><label>\u0623\u0648 \u0631\u0627\u0628\u0637 \u0635\u0648\u0631\u0629 \u0627\u0644\u0634\u0639\u0627\u0631 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)</label><input id="s_l" dir="ltr" placeholder="https://..." value="${esc(site.logo)}"><label>\u0646\u0635 \u0627\u0644\u0634\u0631\u064a\u0637 \u0627\u0644\u0639\u0644\u0648\u064a: \u0646\u0628\u0630\u0629 \u0623\u0648 \u062a\u0648\u062c\u064a\u0647 (\u0641\u0627\u0631\u063a = \u0625\u062e\u0641\u0627\u0621)</label><textarea id="s_b" rows="4">${esc(site.banner)}</textarea><div class="bar"><button class="p" id="s_ok">\u062d\u0641\u0638</button><button data-x>\u0625\u0644\u063a\u0627\u0621</button></div>`);
ov.querySelector('#s_ok').onclick=async()=>{const v=s=>ov.querySelector(s).value.trim();
const r=await sb.from('site').upsert({id:1,name:v('#s_n'),emoji:v('#s_e')||'\ud83c\udf33',logo:v('#s_l'),banner:v('#s_b')});
if(r.error)return toast('\u062a\u0639\u0630\u0631 \u0627\u0644\u062d\u0641\u0638');ov.remove();load()}}
function msgForm(){const ov=overlay(`<h3 style="margin:0">\u0623\u0631\u0633\u0644 \u0633\u0624\u0627\u0644\u0627\u064b \u0623\u0648 \u0645\u0639\u0644\u0648\u0645\u0629</h3><div class="mut">\u062a\u0638\u0647\u0631 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0644\u0644\u062c\u0645\u064a\u0639 \u0628\u0639\u062f \u0645\u0631\u0627\u062c\u0639\u062a\u0647\u0627\u060c \u0648\u064a\u064f\u0631\u062f \u0639\u0644\u064a\u0647\u0627 \u0641\u064a \u0646\u0641\u0633 \u0627\u0644\u0645\u0643\u0627\u0646.</div>
<label>\u0627\u0644\u0627\u0633\u0645 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)</label><input id="m_n" maxlength="60"><label>\u0627\u0644\u0631\u0633\u0627\u0644\u0629</label><textarea id="m_b" rows="5" maxlength="1000"></textarea>
<input id="m_h" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px">
<div class="bar"><button class="p" id="m_ok">\u0625\u0631\u0633\u0627\u0644</button><button data-x>\u0625\u0644\u063a\u0627\u0621</button></div>`);
ov.querySelector('#m_ok').onclick=async()=>{const body=ov.querySelector('#m_b').value.trim(),name=ov.querySelector('#m_n').value.trim();
if(body.length<3)return toast('\u0627\u0643\u062a\u0628 \u0631\u0633\u0627\u0644\u0629 \u0623\u0637\u0648\u0644');
if(ov.querySelector('#m_h').value){ov.remove();return toast('\u062a\u0645 \u0627\u0644\u0625\u0631\u0633\u0627\u0644 \u2705')}
try{if(Date.now()-(+localStorage.getItem('clan_last')||0)<60000)return toast('\u0627\u0646\u062a\u0638\u0631 \u062f\u0642\u064a\u0642\u0629 \u0642\u0628\u0644 \u0625\u0631\u0633\u0627\u0644 \u0631\u0633\u0627\u0644\u0629 \u0623\u062e\u0631\u0649')}catch(e){}
const r=await sb.from('messages').insert({name:name||null,body});
if(r.error)return toast('\u062a\u0639\u0630\u0631 \u0627\u0644\u0625\u0631\u0633\u0627\u0644\u060c \u062d\u0627\u0648\u0644 \u0644\u0627\u062d\u0642\u0627\u064b');
try{localStorage.setItem('clan_last',Date.now())}catch(e){}ov.remove();toast('\u0648\u0635\u0644\u062a \u0631\u0633\u0627\u0644\u062a\u0643 \u0648\u0633\u062a\u0638\u0647\u0631 \u0628\u0639\u062f \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u2705')}}
function repForm(m){const ov=overlay(`<h3 style="margin:0">\u0627\u0644\u0631\u062f \u0639\u0644\u0649 \u0627\u0644\u0631\u0633\u0627\u0644\u0629</h3><div class="mut" style="white-space:pre-wrap">${esc(m.body)}</div><label>\u0631\u062f\u0651\u0643</label><textarea id="r_t" rows="5">${esc(m.reply)}</textarea><div class="bar"><button class="p" id="r_ok">\u062d\u0641\u0638 \u0627\u0644\u0631\u062f</button><button data-x>\u0625\u0644\u063a\u0627\u0621</button></div>`);
ov.querySelector('#r_ok').onclick=async()=>{const t=ov.querySelector('#r_t').value.trim();
const r=await sb.from('messages').update({reply:t||null,status:'approved'}).eq('id',m.id);
if(r.error)return toast('\u062a\u0639\u0630\u0631 \u0627\u0644\u062d\u0641\u0638');ov.remove();load()}}
function loginForm(){const ov=overlay(`<h3 style="margin:0">\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u062f\u064a\u0631 \u0648\u0627\u0644\u0645\u0634\u0631\u0641\u064a\u0646</h3><label>\u0627\u0644\u0628\u0631\u064a\u062f \u0627\u0644\u0625\u0644\u0643\u062a\u0631\u0648\u0646\u064a</label><input id="l_e" type="email" dir="ltr"><label>\u0643\u0644\u0645\u0629 \u0627\u0644\u0633\u0631</label><input id="l_p" type="password" dir="ltr"><div class="bar"><button class="p" id="l_in">\u062f\u062e\u0648\u0644</button><button id="l_up">\u062d\u0633\u0627\u0628 \u062c\u062f\u064a\u062f</button><button data-x>\u0625\u0644\u063a\u0627\u0621</button></div><div class="mut">\u0627\u0644\u062d\u0633\u0627\u0628 \u0627\u0644\u062c\u062f\u064a\u062f \u064a\u0628\u0642\u0649 \u0644\u0644\u062a\u0635\u0641\u062d \u0641\u0642\u0637 \u062d\u062a\u0649 \u064a\u0631\u0642\u0651\u064a\u0647 \u0627\u0644\u0645\u062f\u064a\u0631 \u0625\u0644\u0649 \u0645\u0634\u0631\u0641.</div>`);
const cred=()=>({email:ov.querySelector('#l_e').value.trim(),password:ov.querySelector('#l_p').value});
ov.querySelector('#l_in').onclick=async()=>{const r=await sb.auth.signInWithPassword(cred());if(r.error)toast('\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u062f\u062e\u0648\u0644 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d\u0629');else{ov.remove();boot()}};
ov.querySelector('#l_up').onclick=async()=>{const r=await sb.auth.signUp(cred());if(r.error)return toast(r.error.message);toast('\u062a\u0645 \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062d\u0633\u0627\u0628. \u0625\u0646 \u0637\u064f\u0644\u0628 \u062a\u0623\u0643\u064a\u062f \u0627\u0644\u0628\u0631\u064a\u062f \u0641\u0627\u0641\u062a\u062d \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u062b\u0645 \u0627\u062f\u062e\u0644.');if(r.data.session){ov.remove();boot()}}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t],[data-s],[data-add],[data-edit],[data-del],[data-ok],[data-no],[data-tab],[data-mok],[data-rep],[data-mdel],#add,#edsite,#out,#login,#msg');if(!t)return;const D=t.dataset;
if(D.t){open.has(D.t)?open.delete(D.t):open.add(D.t);render()}
else if(D.s)pick(D.s);
else if(t.id==='add')form({});
else if(t.id==='edsite')siteForm();
else if(t.id==='login')loginForm();
else if(t.id==='msg')msgForm();
else if(t.id==='out'){await sb.auth.signOut();session=null;role='viewer';isAdmin=isStaff=false;tab='tree';await load()}
else if(D.add)form({parentId:D.add});
else if(D.edit)form(byId[D.edit]);
else if(D.tab){tab=D.tab;render()}
else if(D.del){if(confirm('\u062d\u0630\u0641 \u0647\u0630\u0627 \u0627\u0644\u0627\u0633\u0645 \u0646\u0647\u0627\u0626\u064a\u0627\u064b\u061f')){const r=await sb.from('people').delete().eq('id',D.del);if(r.error)toast('\u0644\u0627 \u064a\u0645\u0643\u0646 \u062d\u0630\u0641 \u0627\u0633\u0645 \u0644\u0647 \u0623\u0628\u0646\u0627\u0621');else{sel=null;load()}}}
else if(D.ok){await sb.from('people').update({status:'approved'}).eq('id',D.ok);toast('\u062a\u0645 \u0627\u0644\u0646\u0634\u0631 \u2705');load()}
else if(D.no){if(confirm('\u0631\u0641\u0636 \u0647\u0630\u0627 \u0627\u0644\u0637\u0644\u0628\u061f')){await sb.from('people').delete().eq('id',D.no);load()}}
else if(D.mok){await sb.from('messages').update({status:'approved'}).eq('id',D.mok);toast('\u062a\u0645 \u0646\u0634\u0631 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u2705');load()}
else if(D.rep)repForm(msgs.find(m=>m.id===D.rep));
else if(D.mdel){if(confirm('\u062d\u0630\u0641 \u0647\u0630\u0647 \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0646\u0647\u0627\u0626\u064a\u0627\u064b\u061f')){await sb.from('messages').delete().eq('id',D.mdel);load()}}});
$('#q').oninput=e=>{const q=norm(e.target.value);if(q.length<2){$('#res').innerHTML='';return}
const r=people.filter(p=>norm(full(p.id,10)).includes(q)).slice(0,15);
$('#res').innerHTML=`<div class="card" style="margin-bottom:10px">${r.length?r.map(p=>`<div class="res" data-s="${p.id}"><b>${esc(p.name)}</b><div class="mut">${esc(full(p.id,10))}</div></div>`).join(''):'<span class="mut">\u0644\u0627 \u0646\u062a\u0627\u0626\u062c</span>'}</div>`};
async function load(){let all,st,ms;
try{const[a,b,c]=await Promise.all([sb.from('people').select('*'),sb.from('site').select('*').eq('id',1).maybeSingle(),sb.from('messages').select('*').order('created_at',{ascending:false})]);
if(a.error)throw a.error;all=a.data;st=b.data||{};ms=c.data||[];
try{localStorage.setItem('clan_cache',JSON.stringify({all,st,ms,pub:!isStaff}))}catch(e){}}
catch(e){try{const c=JSON.parse(localStorage.getItem('clan_cache'));all=c.all;st=c.st;ms=c.ms;toast('\u0644\u0627 \u064a\u0648\u062c\u062f \u0627\u062a\u0635\u0627\u0644: \u062a\u064f\u0639\u0631\u0636 \u0622\u062e\u0631 \u0628\u064a\u0627\u0646\u0627\u062a \u0645\u062d\u0641\u0648\u0638\u0629')}catch(_){return toast('\u062a\u0639\u0630\u0631 \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a')}}
all=all.map(r=>({...r,parentId:r.parent_id||''}));
people=all.filter(r=>r.status==='approved');pend=isAdmin?all.filter(r=>r.status==='pending').sort((x,y)=>x.created_at>y.created_at?1:-1):[];
msgs=ms;site=st;index();render();
if(isStaff&&!notified){const n=pend.length+msgs.filter(m=>m.status==='pending').length;if(n){notified=true;toast(`\u0644\u062f\u064a\u0643 ${n} \u0639\u0646\u0635\u0631 \u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629`)}}}
async function boot(){const{data:{session:s}}=await sb.auth.getSession();session=s;role='viewer';
if(s){uid=s.user.id;const pr=await sb.from('profiles').select('role').eq('id',uid).maybeSingle();role=pr.data?.role||'viewer'}
isAdmin=role==='admin';isStaff=isAdmin||role==='moderator';await load();
if(!sub){sub=true;sb.channel('people-ch').on('postgres_changes',{event:'*',schema:'public',table:'people'},()=>load()).subscribe()}}
// \u062a\u062b\u0628\u064a\u062a \u0627\u0644\u062a\u0637\u0628\u064a\u0642
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').style.display=''});
$('#inst').onclick=async()=>{if(dip){dip.prompt();dip=null;$('#inst').style.display='none'}};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)$('#iosh').style.display='';
boot();
</script></body></html>
